name: Android and reliability
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Fetch and verify inference weights
        shell: pwsh
        run: ./scripts/fetch-models.ps1
      - run: chmod +x gradlew && ./gradlew :core:test :perception:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest '-Dorg.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8' '-Pkotlin.compiler.execution.strategy=in-process' --max-workers=1 --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sight-build-and-test-evidence
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/reports/
            core/build/reports/tests/
            perception/build/reports/tests/
  evaluation-tools:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r evaluation/requirements-lock.txt
      - run: python -m unittest discover -s evaluation/tests -v
